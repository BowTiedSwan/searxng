# see https://docs.searxng.org/admin/settings/settings.html#settings-use-default-settings
use_default_settings: true
general:
  debug: true
search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json
    - csv
server:
  # base_url is defined in the SEARXNG_BASE_URL environment variable
  secret_key: "my-custom-secret-key-from-env"
  limiter: false 
  image_proxy: true
ui:
  static_use_hash: true
# Redis configuration
# redis:
#   url: ${REDIS_URL}

# Engine overrides (merged with defaults via use_default_settings).
# Prioritize independent upstream engines; disable the most filtered ones.
engines:
  - name: mojeek
    disabled: false
  - name: gibiru
    disabled: false
  - name: qwant
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: startpage
    disabled: false
  - name: google
    disabled: true
  - name: google cse
    disabled: true
  - name: bing
    disabled: true
